name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.3, 3.4]
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run specs
      run: bundle exec rspec

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.3, 3.4]
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Install dependencies
      shell: pwsh
      run: |
        bundle config set frozen false
        bundle install
    - name: Verify Windows lockfile
      shell: pwsh
      run: |
        git diff -- Gemfile.lock
        git diff --exit-code -- Gemfile.lock
    - name: Run specs
      run: bundle exec rspec

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Install bundler-audit
      run: gem install bundler-audit --no-document
    - name: Audit dependencies
      run: bundle-audit check --update
